<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pull the Lever: Presenter</title>
<style>
  :root { --bg:#0e0e11; --panel:#1b1b21; --ink:#f5f3ee; --muted:#a9a6a0; --accent:#ffd23f; --line:#33333b; --go:#51cf66; --stop:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 16px; border-bottom:3px solid var(--accent); }
  header b { font:800 16px/1 "Arial Narrow",Impact,sans-serif; text-transform:uppercase; letter-spacing:.06em; }
  header a { color:var(--muted); font-size:14px; }
  .wrap { max-width:960px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns: minmax(0,1fr); }
  @media (min-width:860px) { .wrap { grid-template-columns: minmax(0,1fr) 280px; } }
  .card { background:var(--panel); border-radius:12px; padding:16px; }
  .kicker { color:var(--accent); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.05em; margin:0 0 4px; }
  h1 { font:800 24px/1.15 "Arial Narrow",Impact,sans-serif; text-transform:uppercase; margin:0 0 12px; }
  .pill { display:inline-block; padding:3px 10px; border-radius:99px; font-size:13px; font-weight:700; margin:0 6px 12px 0; }
  .on { background:#1f3a24; color:var(--go); } .off { background:#3a1f1f; color:var(--stop); } .info { background:#2b2714; color:var(--accent); }
  .row { margin-bottom:10px; } .row .lbl { display:flex; justify-content:space-between; gap:10px; font-size:15px; }
  .track { height:10px; background:#0e0e11; border-radius:5px; overflow:hidden; margin-top:4px; }
  .fill { height:100%; background:var(--accent); transition:width .5s; }
  .controls { display:grid; grid-template-columns: 1fr 2fr; gap:10px; margin-top:16px; }
  .controls .wide { grid-column: 1 / -1; }
  button { min-height:52px; border-radius:10px; border:2px solid var(--line); background:#25252d; color:var(--ink); font-family:inherit; font-weight:700; font-size:16px; line-height:1.2; cursor:pointer; padding:8px 12px; }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  button.primary { background:var(--accent); color:#111; border-color:var(--accent); font-size:18px; }
  button.danger { color:var(--stop); }
  .sec { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  ol { list-style:none; margin:0; padding:0; }
  ol li button { width:100%; text-align:left; min-height:44px; margin-bottom:6px; font-weight:600; font-size:14px; }
  ol li button[aria-current="true"] { border-color:var(--accent); }
  ol li small { color:var(--muted); font-weight:400; }
  .thumb { float:right; width:150px; aspect-ratio:16/9; object-fit:cover; border-radius:6px; margin:0 0 8px 12px; }
  .hint { color:var(--muted); font-size:13px; margin-top:12px; }
  form { max-width:360px; margin:18vh auto; padding:16px; display:grid; gap:10px; }
  input { min-height:48px; border-radius:10px; border:2px solid var(--line); background:var(--panel); color:var(--ink); font-size:16px; padding:0 12px; }
  .err { color:var(--stop); min-height:1.4em; }
</style>
</head>
<body>
<header><b>Presenter</b><a href="/screen" target="_blank" rel="noopener">Open projector view</a></header>
<div id="root"></div>
<script>
let build = null;
function checkBuild(s) { if (s && s.build) { if (build && s.build !== build) location.reload(); build = s.build; } }
const root = document.getElementById("root");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S = null, timer = null, lastKey = "";

function login(msg = "") {
  clearInterval(timer);
  lastKey = "";
  root.innerHTML = `<form id="f"><label for="k" class="kicker">Admin key</label>
    <input id="k" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">Sign in</button><p class="err" role="alert">${esc(msg)}</p></form>`;
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const r = await fetch("/api/admin/login", {method: "POST", headers: {"Content-Type": "application/json"},
                                               body: JSON.stringify({key: document.getElementById("k").value})});
    r.ok ? start() : login("That key is not right.");
  };
  document.getElementById("k").focus();
}

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {cache: "no-store"});
  if (r.status === 401) { login(); return null; }
  return r.ok ? r.json() : null;
}

async function act(action, extra = {}) {
  const s = await api("/api/admin/action", {action, ...extra});
  if (s) render(s);
}

function render(s) {
  checkBuild(s);
  const key = JSON.stringify(s);
  if (key === lastKey) return;
  lastKey = key;
  S = s;
  const i = s.current, p = i >= 0 ? s.polls[i] : null, n = s.polls.length;
  let main;
  if (!p) {
    main = `<p class="kicker">Lobby</p><h1>Audience sees "Stand by"</h1><p class="hint">The projector view shows the join QR code.</p>`;
  } else {
    const total = p.counts.reduce((a, b) => a + b, 0) || 1;
    main = `${p.image ? `<img class="thumb" src="${esc(p.image)}" alt="">` : ""}<p class="kicker">${esc(p.title)} &middot; slide ${p.slide} &middot; ${i + 1} of ${n}</p><h1>${esc(p.question)}</h1>
      <span class="pill ${s.open ? "on" : "off"}">${s.open ? "Voting open" : "Voting closed"}</span>
      <span class="pill info">${s.results ? "Results showing" : "Results hidden"}</span>
      <span class="pill info">${p.total} vote${p.total === 1 ? "" : "s"}</span>
      ${p.options.map((o, j) => { const pct = Math.round(100 * p.counts[j] / total);
        return `<div class="row"><div class="lbl"><span>${esc(o)}</span><span>${p.counts[j]} &middot; ${pct}%</span></div><div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`; }).join("")}`;
  }
  const nextLabel = i + 1 < n ? `Next: ${esc(s.polls[i + 1].title)}` : "End: back to lobby";
  root.innerHTML = `<div class="wrap"><div>
    <section class="card" aria-live="polite">${main}</section>
    <div class="controls">
      <button data-a="prev" ${i < 0 ? "disabled" : ""}>&larr; Back</button>
      <button class="primary" data-a="${i + 1 < n ? "next" : "lobby"}">${nextLabel} &rarr;</button>
      ${p ? `<button class="wide" data-a="${s.results ? "hide" : "results"}">${s.results ? "Hide results" : "Close voting and show results"}</button>` : ""}
    </div>
    ${p ? `<div class="sec"><button data-a="${s.open ? "close" : "open"}">${s.open ? "Close voting" : "Reopen voting"}</button>
      <button class="danger" data-a="reset">Clear this poll's votes</button></div>` : ""}
    <p class="hint">Keys: &rarr; or Space next, &larr; back, R results, O open or close voting.</p>
  </div>
  <aside class="card"><p class="kicker">Jump to</p><ol>
    <li><button data-goto="-1" aria-current="${i < 0}">Lobby</button></li>
    ${s.polls.map((q, j) => `<li><button data-goto="${j}" aria-current="${i === j}">${esc(q.title)}<br><small>slide ${q.slide} &middot; ${q.total} votes</small></button></li>`).join("")}
  </ol></aside></div>`;
}

root.addEventListener("click", e => {
  const b = e.target.closest("button[data-a], button[data-goto]");
  if (!b) return;
  if (b.dataset.goto !== undefined) return act("goto", {index: +b.dataset.goto});
  if (b.dataset.a === "reset" && !confirm("Clear every vote on this poll?")) return;
  if (b.dataset.a) act(b.dataset.a);
});

document.addEventListener("keydown", e => {
  if (!S || e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
  const n = S.polls.length, i = S.current;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); act(i + 1 < n ? "next" : "lobby"); }
  else if (e.key === "ArrowLeft") act("prev");
  else if (e.key === "r" || e.key === "R") act(S.results ? "hide" : "results");
  else if (e.key === "o" || e.key === "O") act(S.open ? "close" : "open");
});

async function start() {
  const s = await api("/api/admin/state");
  if (!s) return;
  render(s);
  clearInterval(timer);
  timer = setInterval(async () => { const s = await api("/api/admin/state"); if (s) render(s); }, 1500);
}
start();
</script>
</body>
</html>
